[package]
name = "statistics"
version = "0.1.0"
edition = "2021"

[lib]
name = "statistics"
path = "src/lib.rs"

[dependencies]
num-traits = "0.2"
num-complex = "0.4"
rand = "0.8"
special-functions = { path = "../special-functions" }
linalg = { path = "../linalg" }
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
common = { path = "../common" }
