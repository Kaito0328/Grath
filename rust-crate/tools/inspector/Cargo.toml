[package]
name = "inspector"
version = "0.1.0"
edition = "2021"

[lib]
name = "inspector_lib"
path = "src/lib.rs"

[[bin]]
name = "inspector"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
dotenv = "0.15"
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"                                              # 追加: YAML書き込み用
walkdir = "2.3"
quote = "1.0"
syn = { version = "2.0", features = ["full", "visit"] }
regex = "1.0"
tokio = { version = "1.0", features = ["full"] }
convert_case = "0.4"
tera = "1.20.1"
