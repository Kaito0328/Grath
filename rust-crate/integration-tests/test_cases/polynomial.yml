- function: PolynomialSolver::solve_rational
  inputs:
    - "[1, -2, 1]"
  expected: "1,1"
- function: PolynomialSolver::solve_rational
  inputs:
    - "[6, -5, 1]"
  expected: "2,3"
- function: PolynomialApi::find_roots_symbolic_expr
  inputs:
    - "[c, b, a]"
  expected: "a^{-1}(1/2(b^{2} + -4ac)^{1/2} + -1/2b),a^{-1}(-1/2(b^{2} + -4ac)^{1/2} + -1/2b)"
- function: PolynomialApi::find_roots_symbolic_expr
  inputs:
    - "[1, 0, 1]"
  expected: "1/2*-4^{1/2},-1/2*-4^{1/2}"
